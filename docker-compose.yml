services:
  globalflow:
    build:
      context: .
    container_name: globalflow
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      GLOBALFLOW_AUTOPILOT_ENABLED: "1"
    restart: unless-stopped
    ports:
      - "80:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
