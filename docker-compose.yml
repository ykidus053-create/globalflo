services:
  globalflow:
    build:
      context: .
    container_name: globalflow
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GLOBALFLOW_AUTOPILOT_ENABLED: "${GLOBALFLOW_AUTOPILOT_ENABLED:-1}"
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - globalflow_net

  caddy:
    image: caddy:2-alpine
    container_name: globalflow-caddy
    depends_on:
      - globalflow
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - globalflow_net

volumes:
  caddy_data:
  caddy_config:

networks:
  globalflow_net:
