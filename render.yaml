services:
  - type: web
    name: globalflo
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GLOBALFLOW_PUBLIC_BASE_URL
        value: https://globalflow.onrender.com
      - key: GLOBALFLOW_FRONTEND_BASE_URL
        value: https://globalflow.onrender.com
      - key: GLOBALFLOW_GOOGLE_CLIENT_ID
        sync: false
      - key: GLOBALFLOW_GOOGLE_CLIENT_SECRET
        sync: false
      - key: GLOBALFLOW_APPLE_CLIENT_ID
        sync: false
      - key: GLOBALFLOW_APPLE_CLIENT_SECRET
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
