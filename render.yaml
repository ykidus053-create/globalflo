services:
  - type: web
    name: globalflo
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    buildCommand: sh -c "pip install -r requirements.txt || pip install -r globalflow/requirements.txt"
    startCommand: sh -c "uvicorn globalflow.main:app --host 0.0.0.0 --port $PORT || uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    autoDeploy: true
