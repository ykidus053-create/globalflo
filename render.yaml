services:
  - type: web
    name: globalflo
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    buildCommand: pip install -r globalflow/requirements.txt
    startCommand: uvicorn globalflow.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: eliteomni-api
    env: python
    plan: free
    rootDir: assistant_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_ID
        value: kidusllm/EliteOmniReasonerV3
      - key: HF_TOKEN
        sync: false
