<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
        <script>
      (function () {
        try {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("globalflow_theme", "light");
        } catch (error) {}
      })();
    </script>
    <title>GlobalFlow | Account</title>
    <link rel="stylesheet" href="/static/flow.css" />
  </head>
  <body class="paper-site is-loading">
    <div class="site-loader" id="site-loader" aria-hidden="true">
      <div class="site-loader__inner">
        <img class="site-loader__logo" src="/static/globalflow-logo.svg" alt="" />
        <p class="site-loader__word">GlobalFlow</p>
      </div>
    </div>
    <div class="backdrop"></div>
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img class="brand-mark__image" src="/static/globalflow-logo.svg" alt="" />
        </div>
        <div class="brand-copy">
          <span>GlobalFlow</span>
          <p>Account</p>
        </div>
      </div>
      <nav class="nav" aria-label="Account navigation">
        <a href="/">Dashboard</a>
        <a href="/account">Account</a>
      </nav>
    </header>
    <main class="account-page">
      <section class="account-panel">
        <div class="panel-heading">
          <h2>Profile settings</h2>
          <p>Manage identity, alerts, and automation preferences.</p>
        </div>
        <form id="account-form">
          <div class="form-grid">
            <label>
              Full name
              <input name="name" value="{{ profile.name }}" required />
            </label>
            <label>
              Email
              <input type="email" name="email" value="{{ profile.email }}" required />
            </label>
            <label>
              Role
              <input name="role" value="{{ profile.role }}" />
            </label>
            <label>
              Timezone
              <input name="timezone" value="{{ profile.timezone }}" />
            </label>
          </div>
          <div class="form-grid">
            <label>
              Daily digest
              <select name="daily_digest">
                <option value="enabled" {% if settings.daily_digest == "enabled" %}selected{% endif %}>Enabled</option>
                <option value="paused" {% if settings.daily_digest == "paused" %}selected{% endif %}>Paused</option>
              </select>
            </label>
            <label>
              Alert channel
              <select name="alert_channel">
                <option value="Slack" {% if settings.alert_channel == "Slack" %}selected{% endif %}>Slack</option>
                <option value="Email" {% if settings.alert_channel == "Email" %}selected{% endif %}>Email</option>
                <option value="SMS" {% if settings.alert_channel == "SMS" %}selected{% endif %}>SMS</option>
              </select>
            </label>
            <label>
              Automation tier
              <select name="automation_tier">
                <option value="High trust" {% if settings.automation_tier == "High trust" %}selected{% endif %}>
                  High trust
                </option>
                <option value="Autonomous" {% if settings.automation_tier == "Autonomous" %}selected{% endif %}>
                  Autonomous
                </option>
                <option value="Human review" {% if settings.automation_tier == "Human review" %}selected{% endif %}>
                  Human review
                </option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">Save changes</button>
            <span id="account-status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>
    <script src="/static/site-boot.js" defer></script>
    <script type="module" src="/static/account.js"></script>
  </body>
</html>
