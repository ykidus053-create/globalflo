<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ portal.name }} | Payment</title>
    <link rel="stylesheet" href="/static/flow.css" />
  </head>
  <body class="payment-body">
    <header class="top">
      <div class="brand">
        <span>GlobalFlow</span>
        <p>Payment center</p>
      </div>
      <nav class="nav" aria-label="Payment navigation">
        <a href="/">Dashboard</a>
        <a href="/account">Account</a>
      </nav>
    </header>
    <main class="payment-page">
      <header class="payment-header">
        <p class="eyebrow">{{ portal.name }} payment</p>
        <h1>Secure {{ portal.name }} billing</h1>
        <p>
          {{ portal.description }} {{ portal.note }}
        </p>
      </header>

      <section class="payment-panel">
        <div class="payment-icon {{ portal.id }}"></div>
        <div class="payment-details">
          <p class="payment-note">{{ portal.note }}</p>
          <ol>
            {% for step in portal.instructions %}
            <li>{{ step }}</li>
            {% endfor %}
          </ol>
          <div class="payment-actions">
            <a class="primary" href="{{ portal.portal_url }}" target="_blank" rel="noreferrer">{{ portal.action }}</a>
            <button class="ghost" type="button" id="payment-form-trigger">Request invoice</button>
          </div>
        </div>
      </section>

      <section class="payment-form-section">
        <h3>Need a custom invoice?</h3>
        <form id="payment-form">
          <label>
            Business email
            <input name="email" type="email" placeholder="ops@globalflow.ai" required />
          </label>
          <label>
            Amount
            <input name="amount" placeholder="$1,200" />
          </label>
          <label>
            Notes for the finance team
            <textarea name="notes" rows="3" placeholder="Add a project name, tiers, or billing cadence"></textarea>
          </label>
          <button class="primary" type="submit">Send request</button>
          <p class="payment-status" id="payment-status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script type="module" src="/static/payment.js"></script>
  </body>
</html>
