<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>GlobalFlow | Account</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/glass-ai.css" />
      <script>window.GLOBALFLOW_API_BASE = "https://globalflow.onrender.com";window.GLOBALFLOW_STATIC_MODE = true;</script>
  </head>
  <body class="paper-site account-page-shell" data-user-segment="account" data-theme="dark">
    <a class="skip-link" href="#account-main">Skip to account</a>
    <div class="aurora"></div>
    <div class="grid-overlay"></div>
    <header class="top top--airbnb">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="brand-copy">
          <span>GlobalFlow</span>
          <p>Account</p>
        </div>
      </div>
      <nav class="nav" aria-label="Account navigation">
        <a href="/">Home</a>
        <a href="/workflow-elite">Workflow</a>
        <a href="/account" aria-current="page">Account</a>
      </nav>
    </header>
    <main id="account-main" class="landing-main gf-container gf-dark account-page">
      <section class="account-panel gf-card gf-fade">
        <div class="panel-heading">
          <h2>Profile settings</h2>
          <p>Manage identity, alerts, and automation preferences.</p>
        </div>
        <form id="account-form">
          <div class="form-grid">
            <label>
              Full name
              <input name="name" value="Nova Ops" required />
            </label>
            <label>
              Email
              <input type="email" name="email" value="ops@globalflow.ai" required />
            </label>
            <label>
              Role
              <input name="role" value="Automation Architect" />
            </label>
            <label>
              Timezone
              <input name="timezone" value="UTC" />
            </label>
          </div>
          <div class="form-grid">
            <label>
              Daily digest
              <select name="daily_digest">
                <option value="enabled" selected>Enabled</option>
                <option value="paused" >Paused</option>
              </select>
            </label>
            <label>
              Alert channel
              <select name="alert_channel">
                <option value="Slack" selected>Slack</option>
                <option value="Email" >Email</option>
                <option value="SMS" >SMS</option>
              </select>
            </label>
            <label>
              Automation tier
              <select name="automation_tier">
                <option value="High trust" selected>
                  High trust
                </option>
                <option value="Autonomous" >
                  Autonomous
                </option>
                <option value="Human review" >
                  Human review
                </option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">Save changes</button>
            <span id="account-status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/static/account.js"></script>
  </body>
</html>
